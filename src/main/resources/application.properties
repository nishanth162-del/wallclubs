# Database — credentials come from environment variables (set in Render dashboard).
# Nothing secret is committed here. Local dev: export DB_URL/DB_USERNAME/DB_PASSWORD
# or rely on the defaults below.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wallclubs}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.thymeleaf.cache=true
server.port=${PORT:8080}

# Mail credentials are also env vars: SMTP_USERNAME / SMTP_PASSWORD (see EmailConfig)
