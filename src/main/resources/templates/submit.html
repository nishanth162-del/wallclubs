<th:block th:replace="~{layout :: layout(title='Wallclubs - Submit Content', description='Share your smartphone tips or forum posts!', canonical='https://wallclubs.in/submit', content=~{::content})}">
    <th:block th:fragment="content">
        <h1 class="mb-4">Submit Content</h1>
        <h2 class="mb-3">New Article</h2>
        <form method="post" th:action="@{/submit/article}" class="p-4 bg-light rounded shadow">
            <div class="mb-3">
                <label for="title" class="form-label fw-bold">Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <div class="mb-3">
                <label for="slug" class="form-label fw-bold">Slug (e.g., my-article)</label>
                <input type="text" class="form-control" id="slug" name="slug" required>
            </div>
            <div class="mb-3">
                <label for="category" class="form-label fw-bold">Category</label>
                <select class="form-control" id="category" name="category" required>
                    <option value="Smartphones">Smartphones</option>
                    <option value="Tech Tips">Tech Tips</option>
                    <option value="Apps">Apps</option>
                    <option value="Current Affairs">Current Affairs</option>
                    <option value="Lifestyle">Lifestyle</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label fw-bold">Content (min 300 characters)</label>
                <textarea class="form-control" id="content" name="content" rows="10" required></textarea>
                <small class="text-muted" id="charCount">0 characters</small>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Publish</button>
        </form>
        <h2 class="mb-3 mt-5">New Forum Post</h2>
        <form method="post" th:action="@{/submit/post}" class="p-4 bg-light rounded shadow">
            <div class="mb-3">
                <label for="postTitle" class="form-label fw-bold">Title</label>
                <input type="text" class="form-control" id="postTitle" name="title" required>
            </div>
            <div class="mb-3">
                <label for="postContent" class="form-label fw-bold">Content</label>
                <textarea class="form-control" id="postContent" name="content" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="author" class="form-label fw-bold">Author</label>
                <input type="text" class="form-control" id="author" name="author" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Submit Post</button>
        </form>
        <a href="/" class="btn btn-secondary mt-3">Back to Home</a>
    </th:block>
</th:block>
<script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
<script th:inline="javascript">
    tinymce.init({
        selector: '#content',
        plugins: 'lists link',
        toolbar: 'undo redo | bold italic | bullist numlist | link',
        height: 400,
        content_style: 'body { font-size: 18px; }',
        setup: function(editor) {
            editor.on('keyup', function() {
                var content = editor.getContent({format: 'text'});
                document.getElementById('charCount').textContent = content.length + ' characters';
            });
        }
    });
    document.querySelector('form').addEventListener('submit', function(e) {
        var content = tinymce.get('content').getContent({format: 'text'});
        if (content.length < 300) {
            e.preventDefault();
            alert('Content must be at least 300 characters!');
        }
    });
</script>
