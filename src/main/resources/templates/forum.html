<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}"></title>
  <meta name="description" th:content="${description}">
  <meta name="keywords" content="smartphone forum, community, wallclubs">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{layout :: layout(title=${title}, description=${description}, canonical='https://wallclubs.in/forum', content=~{::content})}">
  <th:block th:fragment="content">
    <h1>Community Forum</h1>
    <div th:each="post : ${posts}">
      <h2 th:text="${post.title}"></h2>
      <p th:text="${post.content}"></p>
      <small th:text="'By ' + ${post.author}"></small>
    </div>
    <a href="/" class="btn btn-primary">Back to Home</a>
  </th:block>
</th:block>
</body>
</html>
