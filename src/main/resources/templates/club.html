<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}"></title>
    <meta name="description" th:content="${description}">
    <meta name="keywords" content="affiliate club, earn online, wallclubs">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{layout :: layout(title=${title}, description=${description}, canonical='https://wallclubs.in/club', content=~{::content})}">
    <th:block th:fragment="content">
        <h1>Affiliate Club</h1>
        <h2>Join & Earn</h2>
        <p>Share your link: <code th:text="'https://wallclubs.in/ref/yourcode'"></code></p>
        <h3>Your Stats</h3>
        <table class="table">
            <thead>
            <tr>
                <th>Referral Code</th>
                <th>Total Visits</th>
                <th>Qualified Visits (5+ mins)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ref : ${referrals}">
                <td th:text="${ref.referralCode}"></td>
                <td th:text="${ref.totalVisits}"></td>
                <td th:text="${ref.qualifiedVisits}"></td>
            </tr>
            </tbody>
        </table>
        <a href="/" class="btn btn-primary">Back to Home</a>
    </th:block>
</th:block>
</body>
</html>
