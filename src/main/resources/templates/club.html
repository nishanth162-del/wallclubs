<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}"></title>
    <meta name="description" th:content="${description}">
    <meta name="keywords" content="affiliate club, earn online, wallclubs">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{layout :: layout(title=${title}, description=${description}, canonical=${canonical}, content=~{::content})}">
    <th:block th:fragment="content">
        <h1 class="mb-4">Affiliate Club</h1>
        <p class="lead">Welcome, <span th:text="${username ?: 'Guest'}"></span>! Share your referral link and earn points!</p>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Referral Code</th>
                    <th>Total Visits</th>
                    <th>Qualified Visits</th>
                    <th>Points</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="referral : ${referrals}">
                    <td th:text="${referral.referralCode}"></td>
                    <td th:text="${referral.totalVisits}"></td>
                    <td th:text="${referral.qualifiedVisits}"></td>
                    <td th:text="${referral.points}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <a href="/" class="btn btn-primary mt-3">Back to Home</a>
    </th:block>
</th:block>
</body>
</html>
