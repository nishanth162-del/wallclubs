<th:block th:replace="~{layout :: layout(title=${title}, description=${description}, canonical=${canonical}, content=~{::content})}">
    <th:block th:fragment="content">
        <h1 class="display-4 mb-3">BREAKING TECH NEWS & TIPS</h1>
        <p class="lead mb-4">Stay ahead with exclusive smartphone hacks, join our growing community, and learn how to earn with our affiliate clubs!</p>

        <div class="d-flex align-items-center mb-3">
            <h2 class="mb-0 me-2"><i class="bi bi-fire text-danger"></i> TOP TRENDING</h2>
            <div class="border-bottom flex-grow-1"></div>
        </div>

        <div class="row mb-4" th:if="${trendingArticles != null and not #lists.isEmpty(trendingArticles)}">
            <th:block th:each="article, stat : ${trendingArticles}">
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="card h-100 position-relative">
                        <span class="featured-badge" th:if="${stat.first}">HOT</span>
                        <div class="card-body">
                            <div class="mb-2">
                                <span class="trending-tag" th:text="${article.category}"></span>
                                <span class="trending-tag">2025</span>
                            </div>
                            <h2 class="card-title">
                                <a th:href="@{/articles/{slug}(slug=${article.slug})}" th:text="${article.title}"></a>
                            </h2>
                            <p class="card-text" th:text="${article.description != null ? article.description : 'No content'}"></p>
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="text-muted" th:text="'By ' + ${article.author != null ? article.author : 'Staff Writer'}"></small>
                                <small class="text-muted" th:text="${article.createdAt != null ? #temporals.format(article.createdAt, 'MMM dd, yyyy') : 'Unknown Date'} + ' | ' + ${article.views} + ' views'"></small>
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>

        <div class="d-flex align-items-center mb-3">
            <h2 class="mb-0 me-2"><i class="bi bi-newspaper text-primary"></i> LATEST ARTICLES</h2>
            <div class="border-bottom flex-grow-1"></div>
        </div>

        <div class="row" th:if="${articles != null and not #lists.isEmpty(articles)}" id="article-grid">
            <th:block th:each="article : ${articles}">
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h2 class="card-title">
                                <a th:href="@{/articles/{slug}(slug=${article.slug})}" th:text="${article.title}"></a>
                            </h2>
                            <p class="card-text" th:text="${article.description != null ? article.description : 'No content'}"></p>
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="text-muted" th:text="'By ' + ${article.author != null ? article.author : 'Staff Writer'}"></small>
                                <small class="text-muted" th:text="${article.createdAt != null ? #temporals.format(article.createdAt, 'MMM dd, yyyy') : 'Unknown Date'} + ' | ' + ${article.views} + ' views'"></small>
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>
    </th:block>
</th:block>
