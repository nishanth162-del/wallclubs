<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>signup</title>
</head>
<body>
<th:block th:replace="~{layout :: layout(title=${title}, description=${description}, canonical=${canonical}, content=~{::content})}">
  <th:block th:fragment="content">
    <h1 class="mb-4">Sign Up</h1>
    <p class="lead">Join Wallclubs to share and earn points!</p>
    <form method="post" th:action="@{/signup}" class="p-4 bg-light rounded shadow">
      <div class="mb-3">
        <label for="username" class="form-label fw-bold">Username</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label fw-bold">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Sign Up</button>
    </form>
    <a href="/" class="btn btn-secondary mt-3">Back to Home</a>
  </th:block>
</th:block>
</body>
</html>
