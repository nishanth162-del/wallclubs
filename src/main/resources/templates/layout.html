<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, description, canonical, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}"></title>
    <meta name="description" th:content="${description}">
    <meta name="keywords" th:content="${keywords ?: 'smartphone hacks, community, affiliate earnings, wallclubs'}">
    <link rel="canonical" th:href="${canonical}" />
    <meta property="og:title" th:content="${title}" />
    <meta property="og:description" th:content="${description}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" th:href="${canonical}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 18px; line-height: 1.6; }
        h1 { font-size: 2.5rem; }
        h2 { font-size: 2rem; }
        .btn { font-size: 1.2rem; padding: 10px 20px; }
        .navbar-brand { font-size: 1.5rem; }
        .nav-link { font-size: 1.2rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">Wallclubs.in</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/forum">Forum</a></li>
                <li class="nav-item"><a class="nav-link" href="/club">Club</a></li>
            </ul>
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    Language
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">English</a></li>
                    <li><a class="dropdown-item" href="#">Hindi</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <th:block th:replace="${content}"></th:block>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        var referralCode = /*[[${referralCode}]]*/ null;
        if (referralCode) {
            setTimeout(function() {
                fetch('/track/' + referralCode, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                }).then(response => response.text())
                    .then(data => console.log(data))
                    .catch(error => console.error('Error:', error));
            }, 300000); // 5 mins = 300,000 ms
        }
    });
</script>
</body>
</html>
