<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, description, canonical, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}"></title>
    <meta name="description" th:content="${description}">
    <meta name="keywords" th:content="${keywords ?: 'smartphone hacks, community, affiliate earnings, wallclubs'}">
    <link rel="canonical" th:href="${canonical}" />
    <meta property="og:title" th:content="${title}" />
    <meta property="og:description" th:content="${description}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" th:href="${canonical}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 18px; line-height: 1.6; background-color: #f8f9fa; }
        h1.display-4 { font-size: 3.5rem; margin-bottom: 1rem; }
        p.lead { font-size: 1.5rem; }
        .btn { font-size: 1.2rem; padding: 10px 20px; }
        .navbar-brand { font-size: 1.5rem; }
        .nav-link { font-size: 1.2rem; }
        .card { margin-bottom: 20px; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: scale(1.02); }
        .sidebar { position: sticky; top: 20px; }
        a { text-decoration: none; color: #333; }
        a:hover { color: #007bff; }
        /* Fade animation */
        .page-content { transition: opacity 0.3s ease-in-out; }
        .fade-out { opacity: 0; }
        .fade-in { opacity: 1; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">Wallclubs</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/category/Smartphones">Smartphones</a></li>
                <li class="nav-item"><a class="nav-link" href="/category/Tech Tips">Tech Tips</a></li>
                <li class="nav-item"><a class="nav-link" href="/category/Apps">Apps</a></li>
                <li class="nav-item"><a class="nav-link" href="/category/Current Affairs">Current Affairs</a></li>
                <li class="nav-item"><a class="nav-link" href="/category/Lifestyle">Lifestyle</a></li>
                <li class="nav-item"><a class="nav-link" href="/forum">Forum</a></li>
                <li class="nav-item"><a class="nav-link" href="/club">Club</a></li>
                <li class="nav-item"><a class="nav-link" href="/submit">Submit</a></li>
            </ul>
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    Language
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#" onclick="switchLang('en')">English</a></li>
                    <li><a class="dropdown-item" href="#" onclick="switchLang('hi')">Hindi</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-4 page-content fade-in">
    <div class="row">
        <div class="col-md-8">
            <th:block th:replace="${content}"></th:block>
        </div>
        <div class="col-md-4 sidebar">
            <h3>Categories</h3>
            <ul class="list-group">
                <li class="list-group-item"><a href="/category/Smartphones">Smartphones</a></li>
                <li class="list-group-item"><a href="/category/Tech Tips">Tech Tips</a></li>
                <li class="list-group-item"><a href="/category/Apps">Apps</a></li>
                <li class="list-group-item"><a href="/category/Current Affairs">Current Affairs</a></li>
                <li class="list-group-item"><a href="/category/Lifestyle">Lifestyle</a></li>
            </ul>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        var referralCode = /*[[${referralCode}]]*/ null;
        if (referralCode) {
            setTimeout(function() {
                fetch('/track/' + referralCode, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                }).then(response => response.text())
                    .then(data => console.log(data))
                    .catch(error => console.error('Error:', error));
            }, 300000);
        }
        var savedLang = localStorage.getItem('language') || 'en';
        switchLang(savedLang);

        // Page transition
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                var href = this.getAttribute('href');
                document.querySelector('.page-content').classList.remove('fade-in');
                document.querySelector('.page-content').classList.add('fade-out');
                setTimeout(function() {
                    window.location.href = href;
                }, 300); // Match CSS transition duration
            });
        });
    });

    function switchLang(lang) {
        fetch(`/lang/${lang}.json`)
            .then(response => response.json())
            .then(data => {
                document.querySelector('title').textContent = data.title;
                document.querySelector('meta[name="description"]').setAttribute('content', data.description);
                document.querySelector('h1').textContent = data.homeHeader || data.forumHeader || data.clubHeader;
                document.querySelector('p').textContent = data.homeText || data.clubText;
                localStorage.setItem('language', lang);
            })
            .catch(error => console.error('Language switch error:', error));
    }
</script>
</body>
</html>
