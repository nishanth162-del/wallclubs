<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}"></title>
    <meta name="description" th:content="${description}">
    <meta name="keywords" content="smartphone hacks, tips, wallclubs">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{layout :: layout(title=${title}, description=${description}, canonical='https://wallclubs.in/articles/' + ${article.slug}, content=~{::content})}">
    <th:block th:fragment="content">
        <h1 th:text="${article.title}" class="mb-4"></h1>
        <div class="article-content mb-5">
            <p th:utext="${article.content}"></p> <!-- Full content -->
        </div>
        <div th:if="${nextArticle != null}" class="next-article mt-5">
            <h3 class="fw-bold">Read Next</h3>
            <p><a th:href="@{/articles/{slug}(slug=${nextArticle.slug})}" th:text="${nextArticle.title}" class="text-dark fs-4"><i class="bi bi-arrow-right ms-2"></i></a></p>
        </div>
        <a href="/" class="btn btn-primary mt-3">Back to Home</a>
    </th:block>
</th:block>
</body>
</html>
